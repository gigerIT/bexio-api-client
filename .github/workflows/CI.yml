name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  Test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(main): release')" # Skip test job if it's a release commit

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: --prefer-dist

      - name: Run Tests
        env:
          BEXIO_ACCESS_TOKEN: ${{ secrets.TEST_API_KEY }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
        run: php vendor/bin/pest --colors=always -v --parallel --processes=6

  Release:
    needs: [Test]
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, 'chore(main): release') || success()"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Release Please
        run: npm install --prefix /tmp/release-please-runner --no-save release-please@17.3.0

      - name: Release Please
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_PATH: /tmp/release-please-runner/node_modules
        run: node .github/scripts/release-please.js
